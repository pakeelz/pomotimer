[package]
name = "pomotimer"
version = "0.0.5"
edition = "2024"
license = "MIT"
description = "Pomodoro Timer on CLI"
readme = "README.md"
repository = "https://github.com/pakeelz/pomotimer"
keywords = ["tui", "terminal", "linux", "ratatui", "pomodoro"]
categories = ["Command line utilities", "Utility"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
gag = "1.0.0"
gtk = "0.18.0"
image = "0.25.10"
infer = "0.22.0"
mde = "0.1.2"
ratatui = "0.30.2"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread", "fs"] }
tray-icon = { version = "0.26.1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
